name: Build iOS InAppStore plugin

# Builds the InAppStore plugin (godot-sdk-integrations/godot-ios-plugins)
# against Godot 4.7.2-stable EXACTLY (plugin ABI is not stable across Godot
# point releases) and commits the result back under ios_plugin_built/.
# Manual dispatch only. Does not touch the TestFlight workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-plugin:
    name: Build InAppStore plugin (Godot 4.7.2)
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Checkout ark-pals (commit-back target)
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install scons
        run: |
          python -m pip install scons
          python --version
          scons --version

      - name: Clone godot-ios-plugins (master)
        run: |
          git clone --depth 1 https://github.com/godot-sdk-integrations/godot-ios-plugins.git ios-plugins
          ls ios-plugins/plugins/inappstore

      - name: Clone Godot 4.7.2-stable into the submodule slot
        run: |
          git clone --depth 1 --branch 4.7.2-stable https://github.com/godotengine/godot.git ios-plugins/godot
          git -C ios-plugins/godot log -1 --format='godot HEAD: %H'
          grep -E '"version"' ios-plugins/godot/version.py || true

      - name: Build Godot for iOS (editor target)
        working-directory: ios-plugins/godot
        run: |
          scons platform=ios target=editor -j$(sysctl -n hw.ncpu)
          ls -la bin/ || true

      - name: Generate InAppStore xcframeworks (release + debug)
        working-directory: ios-plugins
        run: |
          ./scripts/generate_xcframework.sh inappstore release 4.0
          ./scripts/generate_xcframework.sh inappstore release_debug 4.0
          mv ./bin/inappstore.release_debug.xcframework ./bin/inappstore.debug.xcframework
          ls -la bin/
          find bin -maxdepth 2 -name '*.xcframework' | sort

      - name: Stage outputs into ios_plugin_built/
        run: |
          rm -rf ios_plugin_built
          mkdir -p ios_plugin_built
          cp ios-plugins/plugins/inappstore/inappstore.gdip ios_plugin_built/
          cp -R ios-plugins/bin/inappstore.release.xcframework ios_plugin_built/
          cp -R ios-plugins/bin/inappstore.debug.xcframework ios_plugin_built/
          cp -R ios-plugins/bin/inappstore.release.xcframework ios_plugin_built/inappstore.xcframework
          find ios_plugin_built | sort

      - name: Upload outputs as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ios-plugin-built
          path: ios_plugin_built/
          retention-days: 14
          if-no-files-found: error

      - name: Commit built plugin back (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios_plugin_built
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build InAppStore iOS plugin against Godot 4.7.2-stable"
            git push origin HEAD:main
          fi
